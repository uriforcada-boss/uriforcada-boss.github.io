<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Marca «Señal»: hueso, tinta e índigo. El punto de acento de la firma
       («Oriol Forcada» + punto) es lo único que se conserva a 16px. -->
