  <text x="6" y="47" font-family="Archivo,Impact,Arial Black,sans-serif"
        font-weight="900" font-size="46" letter-spacing="-3" fill="#0D1520">O</text>
  <circle cx="52" cy="42" r="7" fill="#1E38DE"/>
</svg>
