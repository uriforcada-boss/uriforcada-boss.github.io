<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Sin CSP a propósito: esta página lleva JavaScript en línea y una
     política que lo bloquee la rompe entera. Sacarlo a un fichero aparte
     arreglaría las dos cosas, pero en `catalogo-rodilla` son 560 KB de app
     embebida y el riesgo de tocarla supera al de dejarla. Las 25 páginas sin
     script en línea SÍ llevan CSP. Revisar si algún día se extrae ese JS. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No encontrado · Oriol Forcada</title>
<meta name="robots" content="noindex">
<script>
  /* GitHub Pages sirve ESTE archivo para cualquier ruta que no exista en
     todo el sitio, incluidas las de dentro de /fitness/. La app de fitness
     es una SPA: sus rutas (/fitness/metas, /fitness/progreso…) no son
     archivos reales, así que abrirlas directamente acababa en el 404 de
     GitHub. Aquí se rescatan: se guarda la ruta pedida y se carga la app,
     que navega a ella al arrancar.

     Va en un script sin esperar a nada para que ni se llegue a pintar. */
  (function () {
    var ruta = location.pathname;
    var BASE = '/fitness/';
    if (ruta.indexOf(BASE) === 0) {
      try {
        sessionStorage.setItem(
          'fp:rutaPedida',
          '/' + ruta.slice(BASE.length) + location.search + location.hash
        );
      } catch (e) { /* sin sessionStorage se entra igual, solo que al inicio */ }
      location.replace(BASE);
    }
  })();
</script>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0d0b0a; color: #f5efe9;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    text-align: center; padding: 24px;
  }
  .caja { max-width: 32rem; }
  h1 { font-size: clamp(28px, 8vw, 44px); margin: 0 0 12px; line-height: 1.1; }
  p { color: #a8a29e; line-height: 1.6; margin: 0 0 24px; }
  a {
    display: inline-block; margin: 0 6px;
    padding: 12px 20px; border-radius: 12px;
    background: #fb923c; color: #180c02;
    font-weight: 700; text-decoration: none;
  }
  a.suave { background: transparent; color: #f5efe9; border: 1px solid #2b241f; }
</style>
</head>
<body>
  <div class="caja">
    <h1>Aquí no hay nada</h1>
    <p>La página que buscabas no existe o ha cambiado de sitio.</p>
    <a href="/">Ir al inicio</a>
    <a class="suave" href="/fitness/">Abrir Fitness</a>
  </div>
</body>
</html>
